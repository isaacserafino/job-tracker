<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Tracker</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="styles-components.css">
</head>
<body>
<aside class="sidebar">
  <div class="brand">
    <div class="brand-mark">JT</div>
    <div class="brand-text">Job Tracker<span>search command center</span></div>
  </div>

  <nav class="side-nav" aria-label="Main">
    <button class="nav-btn" data-action="nav" data-view="dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      Dashboard <span class="nav-count" id="navCountDashboard"></span>
    </button>
    <button class="nav-btn" data-action="nav" data-view="prospects">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3 12h18"/></svg>
      Prospects <span class="nav-count" id="navCountProspects"></span>
    </button>
    <button class="nav-btn" data-action="nav" data-view="companies">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 21h18"/><path d="M5 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16"/><path d="M15 9h2a2 2 0 0 1 2 2v10"/><path d="M9 7h1M9 11h1M9 15h1"/></svg>
      Companies <span class="nav-count" id="navCountCompanies"></span>
    </button>
    <button class="nav-btn" data-action="nav" data-view="preferences">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h10M18 6h2"/><circle cx="16" cy="6" r="2"/><path d="M4 12h4M12 12h8"/><circle cx="10" cy="12" r="2"/><path d="M4 18h10M18 18h2"/><circle cx="16" cy="18" r="2"/></svg>
      Fit preferences
    </button>
    <button class="nav-btn" data-action="nav" data-view="sources">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="m3 13 9 5 9-5"/><path d="m3 18 9 5 9-5"/></svg>
      Sources <span class="nav-count" id="navCountSources"></span>
    </button>
    <button class="nav-btn" data-action="nav" data-view="materials">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5Z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg>
      Materials <span class="nav-count" id="navCountMaterials"></span>
    </button>
    <button class="nav-btn" data-action="nav" data-view="activity">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12h4l2-7 4 14 2-7h6"/></svg>
      Activity
    </button>
  </nav>

  <div class="side-footer">
    <div class="side-label">Data</div>
    <div class="side-row">
      <button class="side-btn" data-action="export">Export</button>
      <button class="side-btn" data-action="import">Import</button>
    </div>
    <button class="side-btn" data-action="toggle-theme" id="themeBtn">Dark mode</button>
    <button class="side-btn danger-text" data-action="reset-data">Clear all data</button>
  </div>
</aside>

<main>
  <header class="topbar">
    <div class="topbar-text">
      <h1 id="viewTitle">Dashboard</h1>
      <p id="viewSubtitle"></p>
    </div>
    <div class="top-actions" id="topActions"></div>
  </header>
  <div id="view"></div>
</main>

<input type="file" id="importFile" accept="application/json" hidden>
<div id="drawerRoot"></div>
<div id="modalRoot"></div>
<div id="toastRoot" class="toast-root" aria-live="polite"></div>

<script src="js/core.js" defer></script>
<script src="js/views.js" defer></script>
<script src="js/views-lists.js" defer></script>
<script src="js/views-drawer.js" defer></script>
<script src="js/forms.js" defer></script>
<script src="js/app.js" defer></script>
</body>
</html>
